<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
<title id="title">Villa Fontana ↔ Aldea María Luisa · Ceragon IP-20N / RFU-D</title>
<desc id="desc">Each station connects an IP-20N indoor unit with a RIC-D card to an RFU-D via Ethernet. The two SC1-220 antennas face each other. The inner and outer contours show the first and second Fresnel boundaries. Vertical arrows mark their radii from the line of sight. Schematic, not to scale.</desc>
